server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # No `$uri/`: public/build and public/tree are directories, and /build and
    # /tree are also Laravel routes. With `$uri/` nginx would answer them with a
    # 301 to the directory instead of passing them to index.php.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Long cache for real asset files only. Matched by extension rather than by
    # a /build/ or /tree/ prefix, because Laravel routes live under both
    # prefixes too (POST /tree/share, /build/result, ...). /build/* names are
    # content-hashed; /tree/* names are stable, but the app appends a
    # ?v=<content-hash> that changes on every data refresh.
    location ~* ^/(build|tree)/.+\.(webp|png|jpe?g|gif|avif|svg|ico|json|js|mjs|css|woff2?|ttf|map)$ {
        expires 365d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # Falls through to Laravel when public/ has no robots.txt.
    location = /robots.txt {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
