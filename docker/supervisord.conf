[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Fires poe2:watch-patch, the syncs and the daily prunes (routes/console.php).
[program:scheduler]
command=php /app/artisan schedule:work --whisper
directory=/app
user=www-data
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Webhook, mail and data-export jobs, plus StageGameData. --max-time makes the
; worker exit hourly; supervisor starts a fresh one.
[program:queue]
command=php /app/artisan queue:work --queue=default,mail --sleep=3 --max-time=3600 --tries=5
directory=/app
user=www-data
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
